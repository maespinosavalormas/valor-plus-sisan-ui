<div class="form-header">
  <h2 mat-dialog-title class="form-title">Crear Nuevo Reporte</h2>
  <button mat-icon-button class="close-button" (click)="cancelForm()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="form" mat-dialog-content>
  <div class="form-grid">

    <div class="field full-width">
      <label class="field-label">Título del Reporte<span class="req">*</span></label>
      <input
        class="control"
        type="text"
        formControlName="titulo"
        placeholder="Ingrese el título del reporte"
        maxlength="100"
      />
      <div
        class="field-error"
        *ngIf="form.get('titulo')?.touched && form.get('titulo')?.hasError('required')"
      >
        Campo obligatorio
      </div>
    </div>

    <div class="field full-width">
      <label class="field-label">Descripción<span class="req">*</span></label>
      <textarea
        class="control"
        formControlName="descripcion"
        placeholder="Ingrese la descripción del reporte"
        rows="4"
        maxlength="500"
      ></textarea>
      <div
        class="field-error"
        *ngIf="form.get('descripcion')?.touched && form.get('descripcion')?.hasError('required')"
      >
        Campo obligatorio
      </div>
    </div>

    <div class="field full-width">
      <label class="field-label">Query<span class="req">*</span></label>
      <textarea
        class="control"
        formControlName="query"
        placeholder="Ingrese el query del reporte"
        rows="4"
        maxlength="500"
      ></textarea>
      <div
        class="field-error"
        *ngIf="form.get('query')?.touched && form.get('query')?.hasError('required')"
      >
        Campo obligatorio
      </div>
    </div>

  </div>
</form>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="btn-cancel" type="button" (click)="cancelForm()">Cancelar</button>
  <button
    mat-flat-button
    class="btn-guardar"
    type="button"
    (click)="saveForm()"
    [disabled]="form.invalid"
  >
    Crear Reporte
  </button>
</mat-dialog-actions>
