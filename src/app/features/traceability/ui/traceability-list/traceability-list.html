<table mat-table [dataSource]="records" class="mat-elevation-z8">
  <!-- Columna Acción -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Acción</th>
    <td mat-cell *matCellDef="let record">
      <span class="action-label">{{ getActionLabel(record.action) }}</span>
    </td>
  </ng-container>

  <!-- Columna Fecha -->
  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let record">
      <span class="timestamp-value">{{ record.timestamp | date:'short' }}</span>
    </td>
  </ng-container>

  <!-- Columna Tipo -->
  <ng-container matColumnDef="entityType">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let record">
      <span [ngClass]="getEntityTypeClass(record.entityType)" class="status-badge">
        {{ getEntityTypeLabel(record.entityType) }}
      </span>
    </td>
  </ng-container>

  <!-- Columna Entidad -->
  <ng-container matColumnDef="entityName">
    <th mat-header-cell *matHeaderCellDef>Entidad</th>
    <td mat-cell *matCellDef="let record">
      <span class="user-name">{{ record.entityName }}</span>
    </td>
  </ng-container>

  <!-- Columna Usuario -->
  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let record">
      <span class="user-name">{{ record.user }}</span>
    </td>
  </ng-container>

  <!-- Columna Descripción -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let record">
      <span class="description-value">{{ record.description }}</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onRecordClick(row)"></tr>
</table>

<!-- No data state -->
<div class="no-trazabilidad" *ngIf="records.length === 0">
  <mat-icon class="no-data-icon">history</mat-icon>
  <span class="no-data-text">No hay registros de trazabilidad</span>
</div>
