<div class="form-header">
  <h2 mat-dialog-title class="form-title">
    {{ data.isEdit ? 'Editar Ruta de Atención' : 'Ruta de Atención' }}
  </h2>

  <button mat-icon-button class="close-button" (click)="cancelForm()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="form" mat-dialog-content>
  <div class="form-grid">
    <div class="field">
      <label class="field-label">Activación de la ruta de atención</label>

      <select class="control control-select" formControlName="carePathwayActivatedCode">
        <option value="">Seleccione</option>

        <option value="1">Sí</option>

        <option value="2">No</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Tipo de atención suministrada<span class="req">*</span></label>

      <select class="control control-select" formControlName="typeOfCareProvidedCode">
        <option value="">Seleccione</option>

        <option *ngFor="let care of typeOfCareProvided$ | async" [value]="care.code">
          {{ care.name }}
        </option>
      </select>

      <div
        class="field-error"
        *ngIf="
          form.get('typeOfCareProvidedCode')?.touched &&
          form.get('typeOfCareProvidedCode')?.hasError('required')
        "
      >
        Campo obligatorio
      </div>
    </div>

    <div class="field full-width">
      <label class="field-label">Diagnóstico médico<span class="req">*</span></label>
      <mat-select
        class="filter-select"
        panelClass="evento-select-panel"
        [formControl]="medicalDiagnosisCtrl"
        placeholder="Seleccione diagnóstico"
        disableOptionCentering>
        <mat-option>
          <ngx-mat-select-search
            [formControl]="medicalDiagnosisFilterCtrl"
            placeholderLabel="Buscar diagnóstico..."
            noEntriesFoundLabel="No encontrado">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let diag of filteredDiagnostics" [value]="diag">
          {{ diag.code }} - {{ diag.name }}
        </mat-option>
      </mat-select>
      <div
        class="field-error"
        *ngIf="
          form.get('medicalDiagnosisCode')?.touched &&
          form.get('medicalDiagnosisCode')?.hasError('required')
        "
      >
        Campo obligatorio
      </div>
    </div>
  </div>
</form>

<div class="step-counter">{{ currentStep }}/{{ totalSteps }}</div>

<div mat-dialog-actions class="dialog-actions">
  <button mat-button class="btn-cancel" (click)="goBack()" [disabled]="false">Anterior</button>

  <button
    mat-button
    class="btn-guardar"
    type="button"
    (click)="saveForm()"
    [disabled]="!form.valid"
  >
    {{ isLastStep ? 'Confirmar' : 'Siguiente' }}
  </button>
</div>
