<div class="dialog-container">
  <div class="icon-container" [ngClass]="data.type">
    <mat-icon class="dialog-icon">{{ getIcon() }}</mat-icon>
  </div>

  <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>

  <mat-dialog-content class="dialog-message">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-stroked-button class="btn-cancel" (click)="cancel()">
      {{ data.cancelText }}
    </button>

    <button mat-flat-button class="btn-confirm" (click)="confirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
