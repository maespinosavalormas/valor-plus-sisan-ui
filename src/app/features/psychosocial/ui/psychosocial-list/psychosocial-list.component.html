<div class="search-section">
  <div class="search-container">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Buscar registros psicosocial..."
      class="search-input"
      [(ngModel)]="searchTerm"
      (input)="filterItems()"
    >
    <button
      *ngIf="searchTerm"
      class="clear-search"
      (click)="clearSearch()"
      mat-icon-button
    >
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="filter-container">
    <mat-select
      class="category-filter"
      [(ngModel)]="selectedCategory"
      (selectionChange)="filterItems()"
      placeholder="Todos los municipios">
      <mat-option value="ALL">Todos</mat-option>
      <mat-option value="Medellín">Medellín</mat-option>
      <mat-option value="Envigado">Envigado</mat-option>
      <mat-option value="Itagüí">Itagüí</mat-option>
      <mat-option value="Bello">Bello</mat-option>
      <mat-option value="Caldas">Caldas</mat-option>
      <mat-option value="La Estrella">La Estrella</mat-option>
      <mat-option value="Sabaneta">Sabaneta</mat-option>
      <mat-option value="Copacabana">Copacabana</mat-option>
    </mat-select>
  </div>
</div>
<mat-divider></mat-divider>
<table mat-table [dataSource]="filteredItems" class="mat-elevation-z8">
  <ng-container matColumnDef="documento">
    <th mat-header-cell *matHeaderCellDef>Documento</th>
    <td mat-cell *matCellDef="let item">{{ item.documento }}</td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let item">{{ item.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="edad">
    <th mat-header-cell *matHeaderCellDef>Edad</th>
    <td mat-cell *matCellDef="let item">{{ item.edad }}</td>
  </ng-container>

  <ng-container matColumnDef="municipio">
    <th mat-header-cell *matHeaderCellDef>Municipio</th>
    <td mat-cell *matCellDef="let item">{{ item.municipio }}</td>
  </ng-container>

  <ng-container matColumnDef="acudiente">
    <th mat-header-cell *matHeaderCellDef>Acudiente</th>
    <td mat-cell *matCellDef="let item">{{ item.acudiente }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let item">{{ item.telefono }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaRegistro">
    <th mat-header-cell *matHeaderCellDef>Fecha registro</th>
    <td mat-cell *matCellDef="let item">{{ item.fechaRegistro }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let item">
      <div class="actions-container">
        <button mat-flat-button class="btn-ver" (click)="viewItem(item); $event.stopPropagation()">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-flat-button class="btn-editar" (click)="editItem(item); $event.stopPropagation()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-flat-button class="btn-eliminar" (click)="deleteItem(item); $event.stopPropagation()">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
