<div class="search-section">
  <div class="search-container">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Buscar paquetes de legalización..."
      class="search-input"
      [(ngModel)]="searchTerm"
      (input)="filterItems()"
    >
    <button
      *ngIf="searchTerm"
      class="clear-search"
      (click)="clearSearch()"
      mat-icon-button
    >
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="filter-container">
    <mat-select
      class="category-filter"
      [(ngModel)]="selectedCategory"
      (selectionChange)="filterItems()"
      placeholder="Todos los períodos">
      <mat-option value="ALL">Todos</mat-option>
      <mat-option value="Enero 2024">Enero 2024</mat-option>
      <mat-option value="Febrero 2024">Febrero 2024</mat-option>
      <mat-option value="Marzo 2024">Marzo 2024</mat-option>
    </mat-select>
  </div>
</div>
<mat-divider></mat-divider>
<table mat-table [dataSource]="filteredItems" class="mat-elevation-z8">
  <ng-container matColumnDef="documento">
    <th mat-header-cell *matHeaderCellDef>Documento</th>
    <td mat-cell *matCellDef="let item">{{ item.documento }}</td>
  </ng-container>

  <ng-container matColumnDef="participante">
    <th mat-header-cell *matHeaderCellDef>Participante</th>
    <td mat-cell *matCellDef="let item">{{ item.participante }}</td>
  </ng-container>

  <ng-container matColumnDef="municipio">
    <th mat-header-cell *matHeaderCellDef>Municipio</th>
    <td mat-cell *matCellDef="let item">{{ item.municipio }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaEntrega">
    <th mat-header-cell *matHeaderCellDef>Fecha entrega</th>
    <td mat-cell *matCellDef="let item">{{ item.fechaEntrega }}</td>
  </ng-container>

  <ng-container matColumnDef="periodo">
    <th mat-header-cell *matHeaderCellDef>Período</th>
    <td mat-cell *matCellDef="let item">{{ item.periodo }}</td>
  </ng-container>

  <ng-container matColumnDef="recibe">
    <th mat-header-cell *matHeaderCellDef>Recibe</th>
    <td mat-cell *matCellDef="let item">{{ item.recibe }}</td>
  </ng-container>

  <ng-container matColumnDef="entregadoPor">
    <th mat-header-cell *matHeaderCellDef>Entregado por</th>
    <td mat-cell *matCellDef="let item">{{ item.entregadoPor }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let item">
      <div class="actions-container">
        <button mat-flat-button class="btn-view" (click)="viewItem(item); $event.stopPropagation()">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-flat-button class="btn-editar" (click)="editItem(item); $event.stopPropagation()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-flat-button class="btn-eliminar" (click)="deleteItem(item); $event.stopPropagation()">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
