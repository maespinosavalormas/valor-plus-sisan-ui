<!-- Header de la página -->
<div class="program-header">
  <div class="page-header">
    <button 
      mat-icon-button 
      class="back-button" 
      (click)="onBackClick()"
      *ngIf="showBackButton"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>

    <div class="title-section">
      <h1 class="page-title">{{ program?.name || 'Detalles del Programa' }}</h1>
    <span [ngClass]="getStatusClass(program?.status)" class="status-badge">
      {{ getStatusLabel(program?.status) }}
    </span>
    </div>

    <div class="program-id">
      <span class="id-value">{{ program.id }}</span>
    </div>
  </div>

  <!-- Toggle de vista -->
  <div class="view-toggle">
    <button 
      mat-button 
      class="toggle-btn"
      [class.active]="activeView === 'info'"
      (click)="onViewChange('info')"
    >
      <mat-icon>info</mat-icon>
      Información
    </button>
    <button 
      mat-button 
      class="toggle-btn"
      [class.active]="activeView === 'tasks'"
      (click)="onViewChange('tasks')"
    >
      <mat-icon>assignment</mat-icon>
      Actividades
    </button>
    <button 
      mat-button 
      class="toggle-btn"
      [class.active]="activeView === 'traceability'"
      (click)="onViewChange('traceability')"
    >
      <mat-icon>history</mat-icon>
      Trazabilidad
    </button>
    <button 
      mat-button 
      class="toggle-btn"
      [class.active]="activeView === 'schedule'"
      (click)="onViewChange('schedule')"
    >
      <mat-icon>calendar_today</mat-icon>
      Cronograma
    </button>
  </div>
</div>
