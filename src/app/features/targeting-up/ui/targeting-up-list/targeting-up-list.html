<div class="search-section">
  <div class="search-container">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      placeholder="Buscar focalizaciones UP..."
      class="search-input"
      [(ngModel)]="searchTerm"
      (input)="filterItems()"
    >
    <button
      *ngIf="searchTerm"
      class="clear-search"
      (click)="clearSearch()"
      mat-icon-button
    >
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="filter-container">
    <mat-select
      class="category-filter"
      [(ngModel)]="selectedCategory"
      (selectionChange)="filterItems()"
      placeholder="Todos los tipos de convenio">
      <mat-option value="ALL">Todos</mat-option>
      <mat-option value="Convenio A">Convenio A</mat-option>
      <mat-option value="Convenio B">Convenio B</mat-option>
      <mat-option value="Convenio C">Convenio C</mat-option>
    </mat-select>
  </div>
</div>
<mat-divider></mat-divider>
<table mat-table [dataSource]="filteredItems" class="mat-elevation-z8">
  <ng-container matColumnDef="tipoUP">
    <th mat-header-cell *matHeaderCellDef>Tipo UP</th>
    <td mat-cell *matCellDef="let item">{{ item.tipoUP }}</td>
  </ng-container>

  <ng-container matColumnDef="documento">
    <th mat-header-cell *matHeaderCellDef>Documento</th>
    <td mat-cell *matCellDef="let item">{{ item.documento }}</td>
  </ng-container>

  <ng-container matColumnDef="responsable">
    <th mat-header-cell *matHeaderCellDef>Responsable</th>
    <td mat-cell *matCellDef="let item">{{ item.responsable }}</td>
  </ng-container>

  <ng-container matColumnDef="municipio">
    <th mat-header-cell *matHeaderCellDef>Municipio</th>
    <td mat-cell *matCellDef="let item">{{ item.municipio }}</td>
  </ng-container>

  <ng-container matColumnDef="tipoConvenio">
    <th mat-header-cell *matHeaderCellDef>Tipo convenio</th>
    <td mat-cell *matCellDef="let item">{{ item.tipoConvenio }}</td>
  </ng-container>

  <ng-container matColumnDef="areaDisponible">
    <th mat-header-cell *matHeaderCellDef>Área (m²)</th>
    <td mat-cell *matCellDef="let item">{{ item.areaDisponible }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let item">{{ item.telefono }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let item">
      <div class="actions-container">
        <button mat-flat-button class="btn-ver" (click)="viewItem(item); $event.stopPropagation()">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-flat-button class="btn-editar" (click)="editItem(item); $event.stopPropagation()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-flat-button class="btn-eliminar" (click)="deleteItem(item); $event.stopPropagation()">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
